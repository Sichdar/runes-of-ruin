<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runes of Ruin">
<meta name="theme-color" content="#0b0706">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Runes of Ruin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0706; --ink: #e8dcc4; --dim: #9c8c74; --gold: #d8b070; --gold-dk: #7a5a30;
  --blood: #8a1010; --blood-hi: #c02818; --panel: #17110e;
  --head: 'Cinzel', Copperplate, 'Copperplate Gothic Bold', 'Trajan Pro', Georgia, serif;
  --body: 'IM Fell English', Baskerville, 'Book Antiqua', Georgia, serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
  position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font-family: var(--body); overscroll-behavior: none; }
canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }

/* ---------- buttons ---------- */
.btn { font-family: var(--head); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 15px;
  color: #f6e6c4; padding: 13px 26px; min-width: 150px; border-radius: 4px; position: relative;
  background: linear-gradient(#a81c12, #6a0c08 55%, #3e0604);
  border: 2px solid #c89a58; box-shadow: 0 0 0 2px #1a0806, inset 0 1px 0 rgba(255,220,180,.35), inset 0 -6px 12px rgba(0,0,0,.45), 0 6px 16px rgba(0,0,0,.6);
  text-shadow: 0 2px 2px #000; }
.btn:active { transform: translateY(1px) scale(.98); filter: brightness(1.15); }
.btn.dark { background: linear-gradient(#3a2e26, #1e1612 60%, #120c0a); border-color: #8a6a42; }
.btn.big { font-size: 20px; padding: 16px 40px; min-width: 210px; }
.btn[disabled] { filter: grayscale(.9) brightness(.6); pointer-events: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--gold);
  background: radial-gradient(#2c211a, #120c0a); border: 2px solid var(--gold-dk); box-shadow: 0 3px 8px rgba(0,0,0,.6); }

/* ---------- title ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.screen > * { pointer-events: auto; }
#scr-title .title-wrap { margin-top: calc(var(--sat) + 9vh); text-align: center; pointer-events: none; }
.title-sup { font-family: var(--head); font-size: 13px; letter-spacing: .5em; color: var(--dim); text-transform: uppercase; }
h1.title { font-family: var(--head); font-weight: 900; font-size: clamp(46px, 15vw, 84px); line-height: .9; margin: 10px 0 0;
  letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(#fff2c8 10%, #d8a050 45%, #8a3a14 75%, #4a0a04); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 18px rgba(200,40,20,.45)); }
h1.title span { font-size: .45em; letter-spacing: .3em; display: block; margin: 6px 0; }
.title-btns { margin-top: auto; margin-bottom: calc(var(--sab) + 9vh); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.title-foot { position: absolute; bottom: calc(var(--sab) + 10px); font-size: 12px; color: #6a5a48; pointer-events: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 6px) 10px 0; pointer-events: none; }
.hud-bar { display: flex; align-items: stretch; gap: 8px; pointer-events: auto; max-width: 560px; margin: 0 auto; }
.hud-mid { flex: 1; min-width: 0; border-radius: 8px; padding: 6px 8px 7px;
  background: linear-gradient(#241a14, #120c0a); border: 2px solid var(--gold-dk); box-shadow: 0 4px 12px rgba(0,0,0,.7), inset 0 0 12px rgba(0,0,0,.8); }
.hud-level { font-family: var(--head); font-size: 11px; letter-spacing: .06em; color: var(--dim); text-align: center; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goals { display: flex; justify-content: center; gap: 12px; margin-top: 4px; }
.goal { position: relative; width: 44px; height: 40px; }
.goal canvas { width: 40px; height: 40px; display: block; margin: 0 auto; }
.goal .n { position: absolute; right: -6px; bottom: -4px; font-family: var(--head); font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 0 3px #000, 0 2px 2px #000, 0 0 6px #000; }
.goal.done .n { color: #7dff9a; }
.goal.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.22); } }
.moves { width: 74px; flex: none; border-radius: 50%; aspect-ratio: 1; align-self: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 35%, #b02016, #5a0806 60%, #2a0302); border: 3px solid #c89a58; box-shadow: 0 0 0 2px #1a0806, 0 6px 14px rgba(0,0,0,.7), inset 0 -6px 10px rgba(0,0,0,.5); }
.moves-n { font-family: var(--head); font-weight: 900; font-size: 28px; line-height: 1; color: #fff3d8; text-shadow: 0 2px 2px #000; }
.moves-l { font-family: var(--head); font-size: 9px; letter-spacing: .15em; color: #f0c890; text-transform: uppercase; }
.moves.low { animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px #1a0806, 0 0 22px 6px rgba(255,40,20,.7); } }

/* ---------- map ---------- */
#scr-map { background: linear-gradient(rgba(5,3,3,.55), rgba(5,3,3,.2) 30%, rgba(5,3,3,.6)); }
.map-head { width: 100%; max-width: 560px; padding: calc(var(--sat) + 8px) 12px 6px; display: flex; align-items: center; gap: 10px; }
.map-title { flex: 1; text-align: center; }
.map-title .act { font-family: var(--head); font-weight: 900; font-size: 22px; letter-spacing: .1em; color: var(--gold); text-shadow: 0 2px 3px #000; }
.map-title .nm { font-style: italic; font-size: 16px; color: var(--ink); text-shadow: 0 2px 3px #000; }
.gold { font-family: var(--head); font-weight: 700; color: #ffd870; font-size: 15px; min-width: 42px; text-align: right; text-shadow: 0 2px 2px #000; }
.gold::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px;
  background: radial-gradient(circle at 35% 35%, #fff0a0, #d0a030 55%, #6a4808); box-shadow: 0 0 6px rgba(255,200,80,.6); }
.map-scroll { flex: 1; width: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.map-path { position: relative; margin: 0 auto; max-width: 480px; }
.map-path svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--head); font-weight: 900; font-size: 20px; color: #f6e6c4; text-shadow: 0 2px 2px #000;
  background: radial-gradient(circle at 40% 35%, #9a1a12, #4a0806 65%, #200302); border: 3px solid #c89a58;
  box-shadow: 0 0 0 2px #120604, 0 6px 12px rgba(0,0,0,.7); }
.node.done { background: radial-gradient(circle at 40% 35%, #4a3a2a, #241a12 65%, #100a06); border-color: #8a6a42; color: #c8b090; }
.node.done::after { content: '\2713'; position: absolute; right: -4px; bottom: -4px; font-size: 13px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #2a5a2a; border: 2px solid #c89a58; color: #dfffd8; }
.node.locked { background: radial-gradient(#2a2420, #141010); border-color: #4a3a2a; color: #5a4c40; box-shadow: 0 0 0 2px #0a0606; pointer-events: none; }
.node.current { animation: glow 1.4s infinite; transform: scale(1.12); }
.node.boss { width: 74px; height: 74px; margin: -37px 0 0 -37px; font-size: 26px; }
.node.face { padding: 0; overflow: hidden; }
.node.face canvas { width: 62px; height: 62px; display: block; border-radius: 50%; }
.node.locked.face canvas { opacity: .45; filter: grayscale(.7); }
.node.slain { color: #f0e0c0; text-shadow: 0 0 8px #b0281a, 0 2px 2px #000; font-size: 32px; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px #120604, 0 0 26px 8px rgba(255,60,30,.75); } }
.map-foot { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px calc(var(--sab) + 10px); }
.map-foot .btn { min-width: 0; padding: 10px 14px; font-size: 13px; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(4,2,2,.72); padding: 18px; z-index: 10; }
.panel { width: 100%; max-width: 380px; max-height: calc(100% - var(--sat) - var(--sab)); overflow-y: auto; text-align: center; padding: 22px 20px 20px; position: relative;
  background: radial-gradient(ellipse at 50% 0%, #2c1e16, #160f0c 70%); border: 2px solid #b08a52; border-radius: 6px;
  box-shadow: 0 0 0 4px #0c0605, 0 0 0 5px #5a4228, 0 18px 50px rgba(0,0,0,.9), inset 0 0 30px rgba(0,0,0,.7);
  animation: pop .22s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.panel::before, .panel::after { content: '\2726'; position: absolute; top: 6px; color: #b08a52; font-size: 14px; }
.panel::before { left: 9px; } .panel::after { right: 9px; }
.panel h2 { font-family: var(--head); font-weight: 900; letter-spacing: .08em; margin: 0; font-size: 26px; text-transform: uppercase;
  background: linear-gradient(#ffeec0, #d09a48 60%, #8a3a14); -webkit-background-clip: text; background-clip: text; color: transparent; }
.panel h2.red { background: linear-gradient(#ff9070, #c01808 60%, #600404); -webkit-background-clip: text; background-clip: text; }
.panel .sub { font-style: italic; color: var(--dim); margin-top: 4px; font-size: 17px; }
.panel .body { margin: 14px 0 4px; font-size: 18px; line-height: 1.4; white-space: pre-line; }
.panel .btns { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 18px; }
.panel .row-goals { display: flex; justify-content: center; gap: 16px; margin: 14px 0 6px; flex-wrap: wrap; }
.panel .row-goals .g { width: 64px; font-size: 13px; color: var(--dim); }
.panel .row-goals canvas { width: 50px; height: 50px; display: block; margin: 0 auto 3px; }
.panel .row-goals b { display: block; font-family: var(--head); font-size: 18px; color: var(--ink); }
.panel .tip { margin-top: 12px; padding: 10px 12px; border-top: 1px solid #4a3828; border-bottom: 1px solid #4a3828; font-style: italic; color: #e0cfa8; font-size: 16px; }
.panel .toggles { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.panel .toggles .btn { min-width: 0; font-size: 12px; padding: 9px 12px; }
.divider { height: 12px; margin: 10px auto 0; width: 70%; background: radial-gradient(ellipse, #b08a52 0, transparent 70%); opacity: .35; border-radius: 50%; }
.story { text-align: left; font-size: 18px !important; }

/* ---------- cloister [S06] ---------- */
.stone-ico { display: inline-block; width: 12px; height: 12px; border-radius: 3px; transform: rotate(45deg); vertical-align: 0; margin: 0 2px;
  background: radial-gradient(circle at 35% 35%, #d8e4ff, #6a7ab0 55%, #2a3050); box-shadow: 0 0 6px rgba(140,170,255,.6); }
.stones { font-family: var(--head); font-weight: 700; color: #c8d4ff; font-size: 15px; text-shadow: 0 2px 2px #000; white-space: nowrap; }
.stones::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 3px; transform: rotate(45deg); margin-right: 7px; vertical-align: 0;
  background: radial-gradient(circle at 35% 35%, #d8e4ff, #6a7ab0 55%, #2a3050); box-shadow: 0 0 6px rgba(140,170,255,.6); }
.map-purse { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 52px; }
.map-purse .stones { font-size: 14px; padding: 2px 0; position: relative; }
.map-purse .stones.badge::after { top: 1px; right: auto; left: -26px; width: 18px; height: 18px; font-size: 11px; }
/* S3 helpers [S06] */
.hammer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 12px); pointer-events: auto;
  min-width: 0; font-size: 13px; padding: 9px 18px; white-space: nowrap; }
.hammer:active { transform: translateX(-50%) translateY(1px) scale(.98); }
.hammer.armed { border-color: #ffd870; box-shadow: 0 0 0 2px #1a0806, 0 0 18px 4px rgba(255,200,90,.6); color: #ffe8a8; animation: none; }
.hammer.poor { opacity: .55; }
/* gold during a level [S09] */
.hud-gold { position: fixed; left: 12px; bottom: calc(var(--sab) + 16px); pointer-events: none; min-width: 0; text-align: left;
  padding: 5px 11px 5px 9px; border-radius: 16px; background: rgba(18,12,10,.85); border: 2px solid var(--gold-dk); box-shadow: 0 3px 8px rgba(0,0,0,.6); }
.hud-gold.bump { animation: bump .3s; }
.coin { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-left: 2px;
  background: radial-gradient(circle at 35% 35%, #fff0a0, #d0a030 55%, #6a4808); box-shadow: 0 0 6px rgba(255,200,80,.6); }
.panel .btn.helper { min-width: 0; font-size: 12px; padding: 10px 14px; letter-spacing: .06em; }
.gold-note { font-size: 14px; color: var(--dim); }
.perk-note { font-size: 15px; color: #c8d4ff; font-style: italic; }
.perk-note.off { color: #ff9a70; }
#scr-cloister { background: linear-gradient(rgba(5,3,3,.8), rgba(5,3,3,.92)); }
.cl-art { display: block; border-bottom: 2px solid var(--gold-dk); border-top: 2px solid var(--gold-dk); box-shadow: 0 6px 18px rgba(0,0,0,.7); flex: none; }
.cl-note { font-style: italic; font-size: 14px; color: var(--dim); text-align: center; padding: 8px 16px 2px; max-width: 520px; }
.cl-note.warn { color: #ff9a70; }
.cl-list { flex: 1; width: 100%; max-width: 520px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.cl-card { border-radius: 6px; padding: 10px 12px; background: linear-gradient(#221812, #140e0b); border: 2px solid #5a4228; box-shadow: inset 0 0 14px rgba(0,0,0,.7); }
.cl-card.done { border-color: #8a6a42; background: linear-gradient(#2a2016, #18110c); }
.cl-card.locked { opacity: .55; }
.cl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cl-name { font-family: var(--head); font-weight: 700; font-size: 16px; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
.cl-pips { display: flex; gap: 5px; }
.cl-pips i { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid #6a7ab0; border-radius: 2px; background: #10121c; }
.cl-pips i.on { background: radial-gradient(circle at 35% 35%, #d8e4ff, #6a7ab0 60%, #2a3050); box-shadow: 0 0 6px rgba(140,170,255,.7); }
.cl-perk { font-size: 16px; margin-top: 4px; color: var(--ink); }
.cl-next { font-size: 15px; margin-top: 2px; color: var(--dim); font-style: italic; }
.cl-build { margin-top: 8px; min-width: 0; width: 100%; font-size: 13px; padding: 9px 12px; }
.cl-foot { width: 100%; max-width: 520px; display: flex; justify-content: center; gap: 10px; padding: 6px 12px calc(var(--sab) + 10px); }
.cl-foot .btn { min-width: 0; font-size: 13px; padding: 10px 14px; }
#btnSkipDay { font-size: 11px; letter-spacing: .05em; opacity: .8; }
/* home screen: places, play button, win streak, job progress [S10] */
.cl-artwrap { position: relative; flex: none; }
.cl-place { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; padding: 0;
  background: rgba(10,6,4,.72); border: 1.5px solid var(--gold-dk); color: var(--gold); font-size: 15px; }
.cl-place.prev { left: 8px; } .cl-place.next { right: 8px; }
.cl-place.hidden { display: none; }
.cl-play { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 12px 0; }
.cl-play .btn.big { padding: 11px 40px; }
.cl-play .title-row .btn { width: 108px; padding: 9px 4px; font-size: 12px; letter-spacing: .06em; }
.cl-streak { font-size: 14px; color: var(--dim); text-align: center; line-height: 1.3; }
.cl-streak b { color: #ffc070; font-weight: 400; }
.cl-streak span { display: block; font-style: italic; }
.cl-streak .fl { display: inline-block; width: 10px; height: 14px; border-radius: 50% 50% 45% 45%; background: #2e2420; margin: 0 2px; vertical-align: -2px; }
.cl-streak .fl.on { background: radial-gradient(circle at 50% 70%, #fff0a0, #ff8a20 55%, #a02a08); box-shadow: 0 0 6px #ff8020; }
.cl-note.good { color: #b8e0a0; font-style: normal; }
.cl-prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--dim); }
.cl-prog .bar { flex: 1; height: 6px; border-radius: 3px; background: #10121c; border: 1px solid #3a4260; overflow: hidden; }
.cl-prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6a7ab0, #c8d4ff); }
.cl-list .cl-foot { padding: 4px 0 calc(var(--sab) + 8px); }
/* daily trial and quest board [S08] */
.title-row { display: flex; gap: 10px; }
.title-row .btn { min-width: 0; width: 140px; padding: 12px 8px; font-size: 14px; letter-spacing: .08em; }
.q-list { display: flex; flex-direction: column; gap: 7px; text-align: left; margin-top: -6px; }
.q-card { border-radius: 6px; padding: 7px 10px; background: linear-gradient(#221812, #140e0b); border: 2px solid #5a4228; box-shadow: inset 0 0 14px rgba(0,0,0,.7); }
.q-card.done { border-color: #c89a58; }
.q-card.got { opacity: .55; }
.q-text { font-size: 17px; line-height: 1.2; }
.q-bar { height: 7px; border-radius: 4px; background: #0c0806; border: 1px solid #4a3828; margin: 6px 0 4px; overflow: hidden; }
.q-bar i { display: block; height: 100%; background: linear-gradient(#ffd870, #a8701c); }
.q-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); }
.q-pay { color: #ffd870; font-family: var(--head); font-weight: 700; }
.q-get { width: 100%; min-width: 0; margin-top: 5px; font-size: 13px; padding: 6px 10px; }
.q-note { font-size: 14px; color: var(--dim); font-style: italic; margin-top: 8px; }
.quest-done { font-size: 15px; color: #ffd870; font-style: italic; }
.badge::after { content: '!'; position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; background: #2a60c0; border: 2px solid #c8d4ff; color: #fff; box-shadow: 0 0 10px rgba(120,160,255,.8); letter-spacing: 0; }
/* chests, Cursed and rescue levels, the cast (S7-S9) [S12] */
.chest { width: 132px; height: 110px; display: block; margin: 4px auto 0; overflow: visible; animation: chShake .5s ease-in-out; }
.chest .ch-glow { opacity: 0; transform-box: fill-box; transform-origin: center; animation: chGlow 1.6s .55s ease-out forwards; }
.chest .ch-lid { transform-box: view-box; transform-origin: 18px 50px; animation: chLid .5s .5s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes chShake { 20% { transform: rotate(-5deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); } }
@keyframes chLid { to { transform: rotate(-30deg) translate(-2px, -3px); } }
@keyframes chGlow { 0% { opacity: 0; transform: scale(.4); } 40% { opacity: 1; } 100% { opacity: .75; transform: scale(1.1); } }
.chest-loot { margin-top: 4px; font-family: var(--head); font-weight: 700; font-size: 17px; color: #ffd870; opacity: 0; animation: lootIn .4s .9s forwards; }
.chest-loot div { margin: 3px 0; }
@keyframes lootIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.cl-card.chests { padding: 8px 12px; }
.ch-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: 3px 0; }
.ch-row .ch-name { width: 112px; flex: none; font-family: var(--head); font-size: 12px; letter-spacing: .04em; color: var(--gold); text-transform: uppercase; }
.ch-row .bar { flex: 1; height: 6px; border-radius: 3px; background: #1a1008; border: 1px solid #5a4228; overflow: hidden; }
.ch-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a8701c, #ffd870); }
.ch-row > span:last-child { width: 40px; text-align: right; }
.ch-ico { width: 16px; height: 12px; flex: none; border-radius: 3px 3px 2px 2px; background: linear-gradient(#8a5a2e 45%, #5a5a62 45% 55%, #6a3e1c 55%); border: 1px solid #1a0c04; }
.cursed-note { font-size: 15px; color: #d0a0ff; font-style: italic; }
.rescue-note { font-size: 15px; color: #ff9a80; font-style: italic; }
.node.cursed { border-color: #a070e0; box-shadow: 0 0 0 2px #120604, 0 0 12px 2px rgba(160,100,255,.55), 0 6px 12px rgba(0,0,0,.7); }
.node.cursed::before { content: ''; position: absolute; left: -5px; top: -5px; width: 16px; height: 16px; border-radius: 3px; transform: rotate(45deg);
  background: radial-gradient(circle at 35% 35%, #e0d0ff, #7a50c0 60%, #2a1850); border: 1.5px solid #e0d0ff; }
.node.rescue { border-color: #ff7050; box-shadow: 0 0 0 2px #120604, 0 0 12px 2px rgba(255,80,50,.55), 0 6px 12px rgba(0,0,0,.7); }
.node.rescue::before { content: 'SOS'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 9px; line-height: 1; letter-spacing: .08em;
  padding: 2px 4px; border-radius: 6px; background: #3a0806; border: 1.5px solid #ff7050; color: #ffd0c0; }
.node.locked.cursed, .node.locked.rescue { opacity: .85; }
.btn .tag { display: block; font-size: 11px; letter-spacing: .14em; margin-top: 2px; }
.btn .tag.cursed { color: #e0c8ff; } .btn .tag.rescue { color: #ffc8b8; }
.cast { position: fixed; left: 50%; top: calc(var(--sat) + 8px); z-index: 30; width: min(340px, calc(100% - 32px)); pointer-events: none;
  display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border-radius: 22px;
  background: rgba(16,10,8,.93); border: 1.5px solid var(--gold-dk); box-shadow: 0 6px 18px rgba(0,0,0,.75);
  opacity: 0; transform: translate(-50%, -12px); transition: opacity .35s, transform .35s; }
.cast.home { transform: translate(-50%, calc(-100% + 10px)); }
.cast.on { opacity: 1; transform: translate(-50%, 0); }
.cast.home.on { transform: translate(-50%, -100%); }
.cast-face { width: 40px; height: 40px; flex: none; border-radius: 50%; overflow: hidden; background: #2a1e16; border: 1.5px solid var(--gold-dk); }
.cast-face svg { width: 100%; height: 100%; display: block; }
.cast-text { font-size: 15px; line-height: 1.25; color: var(--ink); }
.cast-text b { display: block; font-family: var(--head); font-size: 10px; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; font-weight: 700; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="scr-title" class="screen">
  <div class="title-wrap">
    <div class="title-sup">A Huntress's Vigil</div>
    <h1 class="title">Runes<span>of</span>Ruin</h1>
  </div>
  <div class="title-btns">
    <button class="btn big" id="btnPlay">Play</button>
  </div>
  <div class="title-foot" id="titleFoot"></div>
</div>

<div id="scr-map" class="screen hidden">
  <div class="map-head">
    <button class="icon-btn" id="btnMapBack" aria-label="Back">&#10094;</button>
    <div class="map-title"><div class="act" id="mapAct">ACT I</div><div class="nm" id="mapName">The Hollow Moors</div></div>
    <div class="map-purse"><div class="gold" id="mapGold">0</div><button class="stones" id="mapStones" aria-label="The Cloister">0</button></div>
  </div>
  <div class="map-scroll" id="mapScroll"><div class="map-path" id="mapPath"></div></div>
  <div class="map-foot">
    <button class="btn dark" id="btnActPrev">&#10094; Act</button>
    <button class="btn" id="btnMapPlay">Play</button>
    <button class="btn dark" id="btnActNext">Act &#10095;</button>
  </div>
</div>

<div id="scr-cloister" class="screen hidden">
  <div class="map-head">
    <button class="icon-btn" id="btnClBack" aria-label="Title">&#10094;</button>
    <div class="map-title"><div class="act" id="clPlace">THE CLOISTER</div><div class="nm" id="clSub">Raise the huntress's sanctuary</div></div>
    <div class="map-purse"><div class="gold" id="clGold">0</div><div class="stones" id="clStones">0</div></div>
  </div>
  <div class="cl-artwrap">
    <canvas id="cloisterArt" class="cl-art"></canvas>
    <button class="cl-place prev hidden" id="btnPlacePrev" aria-label="Previous place">&#10094;</button>
    <button class="cl-place next hidden" id="btnPlaceNext" aria-label="Next place">&#10095;</button>
  </div>
  <div class="cl-play">
    <div class="cl-streak" id="clStreak"></div>
    <button class="btn big" id="btnHomePlay">Level 1</button>
    <div class="title-row"><button class="btn dark" id="btnHomeMap">Map</button><button class="btn" id="btnDaily">Daily Trial</button><button class="btn dark" id="btnQuests">Quests</button></div>
  </div>
  <div class="cl-note" id="clNote"></div>
  <div class="cl-list" id="cloisterList">
    <div class="cl-foot" id="clFoot"><button class="btn dark" id="btnPerks">Perks: On</button><button class="btn dark" id="btnSkipDay">Test: skip a day</button></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-bar">
    <button class="icon-btn" id="btnPause" aria-label="Menu" style="align-self:center">&#9776;</button>
    <div class="hud-mid">
      <div class="hud-level" id="hudLevel"></div>
      <div class="goals" id="goals"></div>
    </div>
    <div class="moves" id="movesBox"><div class="moves-n" id="moves">0</div><div class="moves-l">moves</div></div>
  </div>
  <button class="btn dark hammer" id="btnHammer">Hammer</button>
  <div class="gold hud-gold" id="hudGold">0</div>

</div>

<div id="modal" class="hidden"><div class="panel" id="panel"></div></div>

<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/boss.js"></script>
<script src="js/rescue.js"></script>
<script src="js/board.js"></script>
<script src="assets/art-overrides.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/view.js"></script>
<script src="js/ui.js"></script>
<script src="js/cloister.js"></script>
<script src="js/daily.js"></script>
<script src="js/cast.js"></script>
<script src="js/main.js"></script>
</body>
</html>
